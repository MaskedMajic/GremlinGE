plugins {
    id 'java'
    id 'application'
}

group = 'com.maskedmajic'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.maskedmajic.gremlinge.GremlinGE'
}
