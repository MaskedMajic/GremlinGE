plugins {
    id 'java'
    id 'application'
}

group = 'com.maskedmajic'
version = '0.1.0'

repositories {
    mavenCentral()
    maven { url 'https://repo.runelite.net' }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'

    // RuneLite API surfaces for future plugin integration
    compileOnly 'net.runelite:client:1.12.3'
    compileOnly 'net.runelite:runelite-api:1.12.3'
}

sourceCompatibility = 17
targetCompatibility = 17

mainClassName = 'com.maskedmajic.gremlinge.GremlinGE'
